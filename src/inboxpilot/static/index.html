<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InboxPilot Review Center</title>
  <style>
    :root { --ink: #17221f; --muted: #66736e; --paper: #f5f2ea; --panel: #fffdf8; --line: #d9ddd5; --accent: #d45b36; --accent-dark: #9d3e24; --green: #2d6a55; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 10% 0%, #e5eee5 0 22%, transparent 45%), var(--paper); font: 16px/1.5 Georgia, serif; }
    .shell { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 80px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 28px; }
    .kicker { color: var(--accent-dark); font: 700 12px/1.2 system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font: 700 clamp(34px, 7vw, 68px)/.95 Georgia, serif; letter-spacing: 0; }
    .intro { max-width: 360px; color: var(--muted); margin: 0; }
    .toolbar { display: flex; gap: 12px; align-items: end; margin: 28px 0; flex-wrap: wrap; }
    label { display: grid; gap: 6px; color: var(--muted); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 1px; }
    input { width: min(390px, 100%); padding: 13px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); font: 16px Georgia, serif; }
    button { border: 0; border-radius: 3px; padding: 13px 18px; cursor: pointer; font: 700 14px system-ui, sans-serif; }
    button:disabled { cursor: not-allowed; opacity: .58; }
    .primary { background: var(--accent); color: white; }
    .primary:hover { background: var(--accent-dark); }
    .status { min-height: 28px; color: var(--muted); font: 14px system-ui, sans-serif; }
    .memory-panel { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); }
    .memory-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .memory-header h2 { margin: 0; font-size: 25px; }
    .memory-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .memory-group { padding: 18px; background: var(--panel); border: 1px solid var(--line); }
    .memory-group h3 { margin: 0 0 10px; color: var(--green); font: 700 12px system-ui, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .memory-group p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .memory-empty { color: var(--muted); font-size: 15px; }
    .review { display: none; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 10px 10px 0 #dfe7dc; }
    .review.visible { display: grid; animation: rise .35s ease-out both; }
    .context, .decision { padding: clamp(22px, 5vw, 46px); }
    .context { border-right: 1px solid var(--line); }
    .eyebrow { color: var(--green); font: 700 12px system-ui, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; }
    h2 { margin: 10px 0 22px; font-size: clamp(24px, 4vw, 38px); line-height: 1.05; }
    .meta { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
    .email-body { margin-top: 24px; padding: 16px; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); background: #fbf8ef; font-size: 15px; }
    .email-body-label { display: block; margin-bottom: 8px; color: var(--green); font: 700 11px system-ui, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .reason { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
    .reason strong { display: block; margin-bottom: 6px; font: 700 12px system-ui, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .decision { background: #fbf8ef; }
    .question { font-size: 22px; line-height: 1.2; margin: 0 0 22px; }
    .artifact { white-space: pre-wrap; padding: 16px; margin: 0 0 26px; border-left: 3px solid var(--accent); background: #f1eee5; font-size: 15px; }
    .editor { display: grid; gap: 12px; margin: 0 0 22px; }
    .reply-editor { display: grid; gap: 10px; }
    .reply-editor .primary { justify-self: start; }
    .editor label { color: var(--muted); font: 700 11px system-ui, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    textarea { width: 100%; min-height: 130px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 3px; background: #fffdf8; color: var(--ink); font: 15px/1.5 Georgia, serif; }
    .feedback { min-height: 72px; }
    .feedback-note { margin: -8px 0 18px; color: var(--muted); font: 13px/1.45 system-ui, sans-serif; }
    .actions { display: flex; gap: 10px; }
    .reject { background: #e5e8e1; color: var(--ink); }
    .reject:hover { background: #d5dbd1; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 700px) { .shell { padding-top: 30px; } header { display: block; } .intro { margin-top: 18px; } .review.visible { grid-template-columns: 1fr; } .context { border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="kicker">🧭 InboxPilot / Human in the Loop (HITL)</div><h1>Review Center</h1></div>
      <p class="intro">See what the agent decided, why it decided it, and approve the next step before anything changes.</p>
    </header>
    <form class="toolbar" id="scan-form">
      <button class="primary" type="submit">🔎 Inspect my new primary emails</button>
    </form>
    <div class="status" id="status" aria-live="polite">Waiting for an email to review.</div>
    <div id="reviews" aria-live="polite"></div>
    <section class="memory-panel" aria-live="polite">
      <div class="memory-header"><h2>🧠 My saved preferences</h2><button class="reject" id="refresh-memories">Refresh memories</button></div>
      <div class="memory-list" id="memory-list"><div class="memory-empty">Loading saved preferences...</div></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#scan-form');
    const reviews = document.querySelector('#reviews');
    const status = document.querySelector('#status');
    let configuredEmail = null;
    fetch('/api/config').then(response => response.json()).then(data => {
      configuredEmail = data.email;
      status.textContent = configuredEmail ? 'Ready to review the latest Primary email.' : 'GMAIL_EMAIL is not configured.';
    });
    async function loadMemories() {
      const response = await fetch('/api/memories');
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Could not load saved preferences.');
      const groups = { response: [], triage: [], calendar: [] };
      (data.memories || []).forEach(item => {
        const category = item.metadata && groups[item.metadata.category] ? item.metadata.category : 'triage';
        groups[category].push(item.memory || item.text || 'Saved preference');
      });
      const escapeHtml = value => String(value).replace(/[&<>'"]/g, character => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[character]));
      document.querySelector('#memory-list').innerHTML = Object.entries(groups).map(([category, items]) => `<div class="memory-group"><h3>${escapeHtml(category)}</h3>${items.length ? items.map(item => `<p>${escapeHtml(item)}</p>`).join('') : '<p class="memory-empty">No preferences yet.</p>'}</div>`).join('');
    }
    loadMemories().catch(() => { document.querySelector('#memory-list').innerHTML = '<div class="memory-empty">Could not load saved preferences.</div>'; });
    document.querySelector('#refresh-memories').addEventListener('click', () => loadMemories());
    function show(data) {
      if (data.status === 'empty') { reviews.replaceChildren(); status.textContent = data.message; return; }
      const items = data.status === 'batch' ? data.reviews : [data];
      reviews.replaceChildren(...items.map(createReviewCard));
      const pending = items.filter(item => item.status === 'pending').length;
      status.textContent = pending ? `${pending} email(s) waiting for review.` : `Displayed ${items.length} triaged email(s).`;
    }
    function createReviewCard(data) {
      const card = document.createElement('section');
      card.className = 'review visible';
      const email = data.email || {};
      const decision = data.review_status && data.review_status.decision;
      card.innerHTML = `<div class="context"><div class="eyebrow"></div><h2></h2><div class="meta"></div><div class="email-body"><span class="email-body-label">Original email</span><div class="email-body-content"></div></div><div class="reason"><strong>💡 Why the agent chose this</strong><div class="reasoning"></div></div></div><div class="decision"><p class="question"></p><div class="artifact"></div><div class="editor"><div class="reply-editor"><label>✍️ Edited reply<textarea class="edited-reply"></textarea></label><button class="primary reply-approve" data-decision="approve">✅ Approve and send</button></div><label>🗣️ Feedback and preferences<textarea class="feedback" placeholder="Tell the agent what to change now and what to remember, for example:&#10;Never include my phone number in replies.&#10;Prefer Saturday evenings for weekend meetings."></textarea></label><p class="feedback-note">Revise applies this feedback to the current proposal and saves durable preferences. Approve sends your edited reply exactly as shown and saves durable preferences without regenerating it.</p></div><div class="actions"><button class="primary action-approve" data-decision="approve">✅ Approve action</button><button class="primary" data-decision="revise">✨ Revise with feedback</button><button class="reject" data-decision="reject">❌ Reject</button></div></div>`;
      card.querySelector('.eyebrow').textContent = (data.intent || 'unknown').replace('_', ' ');
      card.querySelector('h2').textContent = email.subject || 'No subject';
      card.querySelector('.meta').textContent = email.from || 'Unknown sender';
      card.querySelector('.email-body-content').textContent = email.body || 'No email body was available.';
      card.querySelector('.reasoning').textContent = data.reasoning || 'No reasoning provided.';
      card.querySelector('.question').textContent = data.status === 'complete' ? (decision ? `Decision recorded: ${decision}.` : 'No action was taken for this email.') : (data.question || 'Approve this proposed step?');
      const artifact = [data.draft_reply ? `Draft reply:\n${data.draft_reply}` : '', data.proposed_action ? `Proposed action:\n${data.proposed_action}` : ''].filter(Boolean).join('\n\n');
      card.querySelector('.artifact').textContent = artifact;
      card.querySelector('.artifact').style.display = artifact ? 'block' : 'none';
      const editor = card.querySelector('.editor');
      const editedReply = card.querySelector('.edited-reply');
      const reviseButton = card.querySelector('[data-decision="revise"]');
      const replyApproveButton = card.querySelector('.reply-approve');
      const actionApproveButton = card.querySelector('.action-approve');
      if (data.status === 'pending' && ['respond', 'respond_and_block_calendar'].includes(data.intent)) {
        editedReply.value = data.draft_reply || '';
        actionApproveButton.style.display = 'none';
      } else if (data.status === 'pending' && data.intent === 'block_calendar') {
        card.querySelector('.reply-editor').style.display = 'none';
        actionApproveButton.textContent = '✅ Approve action';
      } else {
        editor.style.display = 'none';
        reviseButton.style.display = 'none';
        replyApproveButton.style.display = 'none';
      }
      if (data.status === 'complete') {
        card.querySelector('[data-decision="reject"]').style.display = 'none';
        if (decision === 'approve') {
          actionApproveButton.textContent = data.intent === 'block_calendar' ? '✅ Action completed' : '✅ Sent';
          actionApproveButton.disabled = true;
        } else {
          card.querySelector('.actions').style.display = 'none';
        }
      }
      if (data.status === 'pending') card.dataset.reviewId = data.review_id;
      return card;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!configuredEmail) { status.textContent = 'GMAIL_EMAIL is not configured.'; return; }
      status.textContent = 'Checking Gmail and asking Nebius to triage the latest message...';
      try {
        const response = await fetch('/api/review');
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Could not load reviews.');
        show(data);
      }
      catch (error) { status.textContent = `Could not load review: ${error.message}`; }
    });
    reviews.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-decision]');
      if (!button) return;
      const reviewId = button.closest('.review').dataset.reviewId;
      status.textContent = 'Recording your decision...';
      const card = button.closest('.review');
      const payload = { decision: button.dataset.decision };
      if (button.dataset.decision === 'revise' || button.dataset.decision === 'approve') {
        payload.edited_reply = card.querySelector('.edited-reply').value;
        payload.feedback = card.querySelector('.feedback').value;
      }
      card.querySelectorAll('button').forEach(action => { action.disabled = true; });
      try {
        const response = await fetch(`/api/review/${encodeURIComponent(reviewId)}/decision`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'The review action failed.');
        card.replaceWith(createReviewCard(data));
        status.textContent = payload.decision === 'revise' ? 'The proposal was revised and is ready for review.' : `Decision recorded: ${payload.decision}.`;
      } catch (error) {
        status.textContent = `Could not complete the review: ${error.message}`;
        card.querySelectorAll('button').forEach(action => { action.disabled = false; });
      }
    });
  </script>
</body>
</html>
